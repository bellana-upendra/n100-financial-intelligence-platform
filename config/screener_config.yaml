database:
  path: data/processed/nifty100.db

settings:
  latest_year: null
  financial_sector_name: Financials

metrics:
  roe:
    column: return_on_equity_pct

  debt_to_equity:
    column: debt_to_equity

  free_cash_flow:
    column: free_cash_flow_cr

  revenue_cagr_5yr:
    column: revenue_cagr_5yr

  pat_cagr_5yr:
    column: pat_cagr_5yr

  operating_profit_margin:
    column: operating_profit_margin_pct

  pe_ratio:
    column: pe_ratio

  pb_ratio:
    column: pb_ratio

  dividend_yield:
    column: dividend_yield_pct

  interest_coverage:
    column: interest_coverage_filter

  market_cap:
    column: market_cap_crore

  net_profit:
    column: net_profit

  eps_cagr_5yr:
    column: eps_cagr_5yr

  asset_turnover:
    column: asset_turnover

  sales:
    column: sales

  dividend_payout:
    column: dividend_payout_pct

  revenue_cagr_3yr:
    column: revenue_cagr_3yr

  latest_fcf_positive:
    column: latest_fcf_positive

  debt_to_equity_declining:
    column: debt_to_equity_declining

presets:
  quality_compounder:
    display_name: Quality Compounder
    filters:
      roe:
        operator: gt
        value: 15
      debt_to_equity:
        operator: lt
        value: 1.0
      free_cash_flow:
        operator: gt
        value: 0
      revenue_cagr_5yr:
        operator: gt
        value: 10

  value_pick:
    display_name: Value Pick
    filters:
      pe_ratio:
        operator: lt
        value: 20
      pb_ratio:
        operator: lt
        value: 5.0
      debt_to_equity:
        operator: lt
        value: 2.0
      dividend_yield:
        operator: gt
        value: 1

  growth_accelerator:
    display_name: Growth Accelerator
    filters:
      pat_cagr_5yr:
        operator: gt
        value: 20
      revenue_cagr_5yr:
        operator: gt
        value: 15
      debt_to_equity:
        operator: lt
        value: 2.0

  dividend_champion:
    display_name: Dividend Champion
    filters:
      dividend_yield:
        operator: gt
        value: 2
      dividend_payout:
        operator: lt
        value: 80
      free_cash_flow:
        operator: gt
        value: 0

  debt_free_blue_chip:
    display_name: Debt-Free Blue Chip
    filters:
      debt_to_equity:
        operator: lte
        value: 0.01
        skip_financials: false
      roe:
        operator: gt
        value: 12
      sales:
        operator: gt
        value: 5000

  turnaround_watch:
    display_name: Turnaround Watch
    filters:
      revenue_cagr_3yr:
        operator: gt
        value: 10
      latest_fcf_positive:
        operator: eq
        value: true
      debt_to_equity_declining:
        operator: eq
        value: true